<script>
const modules=[
{title:'Cloud Computing Fundamentals',tag:'雲端基本思維',goal:'能說明企業何時應選 Public、Private、Hybrid Cloud，以及服務責任如何分配。',topics:['IaaS / PaaS / SaaS','Public / Private / Hybrid Cloud','Shared Responsibility','Cloud vs On-prem'],deliver:'一頁 Cloud vs On-prem 決策矩陣',sections:[
['雲端運算到底提供什麼？',`<p>Cloud Computing 是透過網路依需求取得可管理的運算、儲存與網路資源。真正的價值不只是「把 Server 搬到別人的機房」，而是<strong>彈性容量、標準化管理、可用性選項與按使用量計費</strong>。但仍要評估費用、資料治理、網路依賴及供應商綁定。</p><div class="callout"><b>PM 判斷：</b>產品要不要上雲，不是技術成熟度排名，而是取決於客戶部署限制、法規、延遲、運維能力與總持有成本（TCO）。</div>`],
['IaaS、PaaS、SaaS 的責任邊界',`<div class="tablewrap"><table><tr><th>模型</th><th>提供什麼</th><th>使用方仍要管理</th><th>示例</th></tr><tr><td>IaaS</td><td>VM、網路、基礎儲存</td><td>OS、Runtime、App、資料、安全設定</td><td>雲端虛擬機</td></tr><tr><td>PaaS</td><td>託管執行／資料服務</td><td>App、資料、權限、設定</td><td>Managed Database / App Service</td></tr><tr><td>SaaS</td><td>完整應用服務</td><td>帳號、設定、資料治理與使用政策</td><td>企業雲端協作工具</td></tr></table></div><p>Shared Responsibility（共同責任模型）會隨服務類型而改變。即使採 SaaS，使用者或企業通常仍需正確設定存取權及資料政策。</p>`],
['部署型態如何選？',`<div class="tablewrap"><table><tr><th>型態</th><th>優點</th><th>風險／限制</th></tr><tr><td>Public Cloud</td><td>全球資源、擴容快、託管選項多</td><td>持續費用、資料主權、網路依賴</td></tr><tr><td>Private Cloud / On-prem</td><td>資料與設備掌控度高、可配合封閉網路</td><td>硬體採購、維護、容量上限</td></tr><tr><td>Hybrid Cloud</td><td>敏感資料地端、彈性算力在雲端</td><td>身份整合、網路、資料流與故障處理複雜</td></tr></table></div>`],
['Synology 實作情境：ChatPlus 與 AI Center',`<p>假設金融客戶要求 ChatPlus 訊息完全留在 NAS，但 AI 摘要功能希望使用雲端模型。PM 應確認：</p><ol><li>哪種資料會送往 Cloud？是否含原始訊息、個資或附件？</li><li>連線中斷時哪些功能繼續運作？</li><li>是否允許選擇地區、模型供應商及留存政策？</li><li>按量計費與硬體採購的 TCO 如何比較？</li></ol><div class="callout"><b>交付：</b>建立決策表，列出三個選項（全地端／全雲端／混合）及五項準則（資料主權、延遲、成本、擴容、維護），寫出你的推薦與前提。</div>`]
],quiz:[['IaaS 最典型需要使用者自行維護哪一層？',['實體資料中心大樓','Guest OS 與 App','供應商的硬碟韌體','供應商全球骨幹'],1,'IaaS 通常由使用方管理 Guest OS、應用與資料。'],['Hybrid Cloud 的主要代價？',['不需要網路','整合與故障邊界較複雜','永遠最便宜','沒有任何資安責任'],1,'混合部署需管理跨邊界的身份、資料、網路和復原。'],['SaaS 使用者完全不需管資安嗎？',['是','否，仍要管理權限及資料政策','只需管 CPU','只需管硬碟'],1,'共同責任依服務模式而異，帳號與資料治理仍重要。'],['金融客戶要求訊息不離開地端，第一個問題應是？',['哪家 Cloud Logo 好看','明確定義資料流與合規邊界','直接使用最大 GPU','取消 Logs'],1,'部署決策先確認資料的實際流向與約束。'],['Cloud 的優勢不包括？',['按需求擴容','標準化託管服務','任何情境下總成本必然較低','跨區域部署選項'],2,'雲端未必在所有負載與時程下都更便宜。']]},
{title:'AWS / GCP / Azure Services',tag:'服務選型與映射',goal:'看懂三大平台的 Compute、Storage、Networking、Identity 對應，能選擇服務類型。',topics:['Compute / Managed Services','Object Storage','VPC / IAM','Vendor Lock-in'],deliver:'三大雲平台服務對應與選型表',sections:[
['先理解服務類別，再記產品名稱',`<p>對 Technical PM 最重要的是先識別需求需要哪一類服務：<b>Compute</b> 執行工作、<b>Storage</b> 保存內容、<b>Database</b> 管理資料、<b>Networking</b> 控管連線、<b>IAM</b> 控管身分與授權、<b>Observability</b> 提供監控證據。</p><p>服務名稱可能變更、產品能力與計價亦不同；以下是概念映射，不是功能完全等價。</p>`],
['三大平台核心服務對照',`<div class="tablewrap"><table><tr><th>類別</th><th>AWS</th><th>Google Cloud</th><th>Azure</th></tr><tr><td>VM</td><td>EC2</td><td>Compute Engine</td><td>Virtual Machines</td></tr><tr><td>Object Storage</td><td>S3</td><td>Cloud Storage</td><td>Blob Storage</td></tr><tr><td>Managed SQL</td><td>RDS</td><td>Cloud SQL</td><td>Azure SQL Database*</td></tr><tr><td>Kubernetes</td><td>EKS</td><td>GKE</td><td>AKS</td></tr><tr><td>Virtual Network</td><td>VPC</td><td>VPC</td><td>Virtual Network</td></tr><tr><td>Identity / Access</td><td>IAM</td><td>Cloud IAM</td><td>Azure RBAC + Microsoft Entra ID</td></tr></table></div><p><small>*Azure SQL Database 是特定託管資料庫產品，並非與所有 RDS 引擎逐項等價。</small></p>`],
['Compute 與 Storage 如何選？',`<div class="tablewrap"><table><tr><th>需求</th><th>優先考慮</th><th>PM 必問</th></tr><tr><td>完全控制 OS 或專用 Runtime</td><td>VM</td><td>誰負責 Patch、擴容、映像更新？</td></tr><tr><td>標準容器服務</td><td>Managed Container Platform</td><td>是否真的需要 K8s 複雜度？</td></tr><tr><td>事件驅動短任務</td><td>Serverless</td><td>執行時間、冷啟動、並發上限？</td></tr><tr><td>附件、模型檔案、備份</td><td>Object Storage</td><td>存取權、保留、版本、Egress 費？</td></tr><tr><td>結構化交易資料</td><td>Managed SQL</td><td>備份、可用性、遷移、性能？</td></tr></table></div>`],
['PM 決策：Vendor Lock-in 與成本',`<p>服務選擇不能只比每月 VM 價格，還須納入 <b>Egress（對外資料傳輸費）、Storage、GPU、Support、運維人力、Region、合規及 Migration Cost</b>。</p><p>採用特定雲廠商專有的資料庫、身份或 AI API 會加快開發，但日後搬遷可能更昂貴。可用 ADR（Architecture Decision Record）記錄採購與退出策略。</p><div class="callout"><b>交付：</b>在 AWS / GCP / Azure 各挑一組 Compute + Storage + Identity 服務供「AI 摘要 API」使用，依運維負擔、成本可預測性、區域性及遷移難度比較。不要求算即時價格。</div>`]
],quiz:[['AWS S3 的服務類別是？',['Object Storage','關聯式資料庫','VPN','身分提供者'],0,'S3 是物件儲存服務。'],['Azure Virtual Network 主要用於？',['建立雲端網路邊界','語音辨識','計價查詢','寫入程式碼'],0,'Virtual Network 為 Azure 的虛擬網路資源。'],['雲端選型最不該忽略？',['Egress、維運與遷移成本','按鈕顏色','產品命名長度','字體'],0,'TCO 不只包含運算實例費。'],['需要 OS 完整控制權時，哪類較常用？',['VM','純 SaaS','文件編輯器','DNS 記錄'],0,'VM 通常提供較完整的 Guest OS 控制。'],['EKS、GKE、AKS 的共同服務類別？',['Managed Kubernetes','Object Storage','CDN','電子郵件'],0,'三者皆為託管 Kubernetes 服務。']]},
{title:'Cloud Infrastructure Architecture',tag:'網路與可靠性邊界',goal:'能閱讀雲端網路架構圖、掌握 Region/AZ/VPC/Subnet 與對外暴露風險。',topics:['Region / Availability Zone','VPC / Subnet','Public vs Private','Security Group / NAT'],deliver:'具信任邊界的雲端部署架構圖',sections:[
['Region 與 Availability Zone',`<p><b>Region</b> 是雲端資源的地理區域；<b>Availability Zone (AZ)</b> 是 Region 內具一定故障隔離設計的區域。使用多 AZ 可以降低單一 AZ 故障風險，但不能直接保證所有組件都高可用。</p><p>PM 應確認資料駐留、服務可用的 Region、跨區費用、Backup 位置與故障範圍（Blast Radius）。</p>`],
['VPC、Subnet、Route 與 Firewall',`<p><b>VPC（Virtual Private Cloud）</b> 是隔離的邏輯網路；<b>Subnet</b> 切分 IP 範圍，常分為 Public-facing 和 Private 子網。Route Table 控制下一跳；Security Group / Network ACL 等控制通行規則。</p><div class="flowlabel">典型分層示意（非實際 Synology 架構）</div><div class="flow"><div class="step"><b>Internet</b><small>External Clients</small></div><span class="arrow">→</span><div class="step"><b>Public Entry</b><small>DNS / LB / WAF</small></div><span class="arrow">→</span><div class="step"><b>Private API</b><small>App Tier</small></div><span class="arrow">→</span><div class="step"><b>Private DB</b><small>Data Tier</small></div></div><div class="callout"><b>原則：</b>DB 通常不應直接對 Internet 開放。是否公開取決於路由、網路與存取規則，不能只看 Subnet 名稱。</div>`],
['NAT、Load Balancer、VPN 與 Private Connectivity',`<p><b>NAT</b> 讓私有網路中的工作負載按策略對外建立連線，而不必將每個實例公開。<b>Load Balancer</b> 分配流量；<b>VPN / Private Link</b> 等方式可連接地端與 Cloud，但仍需評估加密、驗證、可用性與延遲。</p><p>對 On-prem NAS，企業防火牆、Proxy、DNS、外連政策常比應用功能更直接影響部署可行性。</p>`],
['Synology 情境：Cloud AI API 故障定位',`<p>假設 NAS 上的 AI Console 無法呼叫 Cloud AI Center。PM 不應立即推斷模型服務故障，而應拆解：</p><ol><li>NAS 是否能解析目標 DNS？</li><li>Firewall / Proxy 是否允許對外 HTTPS？</li><li>API Gateway 是否回傳 401、403、429、5xx？</li><li>Cloud Region 是否可用、是否有限額？</li><li>能否用安全的 Request ID 關聯 Server Logs？</li></ol><div class="callout"><b>交付：</b>畫出 NAS → Corporate Firewall / Proxy → Cloud Gateway → API → Private DB / Model 的架構圖，標記五個故障點與監控證據。</div>`]
],quiz:[['Region 最接近？',['地理部署區域','單一容器','唯一子網','一筆資料'],0,'Region 是地理區域層級。'],['多 AZ 是否保證端到端零停機？',['是','否，仍須評估共同依賴與資料層','只對 UI 有效','只需有兩個 DNS 名稱'],1,'多 AZ 只是降低部分故障風險。'],['Database 最常採取的對外連線策略？',['直接開放所有來源','在 Private Network 限制來源','刪除所有認證','只看 UI'],1,'應限制網路暴露與存取來源。'],['NAT 的常見用途？',['私有實例受控對外連線','編寫 Kubernetes YAML','將 SQL 轉成 JSON','讓硬碟加速'],0,'NAT 可支援私有網路主動對外連線。'],['NAS 無法呼叫 Cloud API，第一步應？',['直接重灌','分層檢查 DNS、網路、TLS、API 回應','立刻刪除 DB','直接提高費率'],1,'分層排障才能有效定位。']]},
{title:'Virtualization & Infrastructure',tag:'運算資源的基本單位',goal:'分清 Bare Metal、VM、Container 與 Hypervisor，理解資源隔離與部署代價。',topics:['Bare Metal / Hypervisor','VM vs Container','CPU / Memory / Disk I/O','Hardware Constraints'],deliver:'NAS Package、VM、Container 部署比較表',sections:[
['Bare Metal、Hypervisor、VM',`<p><b>Bare Metal</b> 指直接在實體硬體上執行系統。<b>Hypervisor</b> 可分配硬體資源給多個 <b>Virtual Machines</b>；每個 VM 一般具有自己的 Guest OS。VM 能隔離不同系統，但需要 OS 維護和相應記憶體、磁碟資源。</p><p>這與 Firmware / Embedded Linux 的交集是：CPU 架構、Kernel、Driver、開機流程與可用資源會限制能部署哪些工作負載。</p>`],
['Container 與 VM 的根本差別',`<div class="tablewrap"><table><tr><th>面向</th><th>VM</th><th>Container</th></tr><tr><td>隔離</td><td>由虛擬化層隔離虛擬硬體與 OS</td><td>通常共享 Host Kernel，使用 Namespace / Cgroups 等隔離</td></tr><tr><td>映像</td><td>通常含 Guest OS</td><td>含應用及相依環境</td></tr><tr><td>啟動</td><td>通常較重</td><td>通常較輕量</td></tr><tr><td>相容性</td><td>需支援的 Hypervisor / OS / 架構</td><td>需相容的 Kernel / CPU 架構及 Runtime</td></tr><tr><td>維護</td><td>Guest OS Patch</td><td>Image、Host Kernel、Runtime 都需維護</td></tr></table></div><div class="callout">容器不是「小型完整 VM」，也不保證比 VM 絕對安全。Docker / Kubernetes 的操作細節留到 TPM W13–W15。</div>`],
['資源與效能限制',`<p>一個服務能否部署，需盤點 <b>CPU Architecture (x86 / ARM)、RAM、Disk Capacity、IOPS、Network Throughput、GPU / NPU、Driver、Kernel Version</b>。某些模型只有特定加速器或 Runtime 才能執行。</p><p>對 NAS 上的 ChatPlus / Meet，需要考慮儲存 I/O、持續連線、視訊轉發與其他套件共享硬體資源的競爭。不能僅以「容器能啟動」就視為容量驗收通過。</p>`],
['PM 實作：部署方式選擇',`<p>假設某套件要同時支援小型 NAS 與具 GPU 的伺服器。比較：</p><ol><li>Native Package：設備相依性與升級機制。</li><li>VM：OS 管理、隔離與硬體成本。</li><li>Container：映像交付、版本隔離、Host 依賴。</li></ol><div class="callout"><b>交付：</b>以可用 RAM、硬體架構、運維、升級、隔離、硬體加速六項準則製作選型矩陣，說明不能採用的部署選項。</div>`]
],quiz:[['VM 通常與 Container 的差異？',['VM 通常有自己的 Guest OS','Container 必定有完整獨立 Kernel','VM 不需硬體','兩者一模一樣'],0,'VM 通常具有 Guest OS；容器一般共享 Host Kernel。'],['Container 能否在所有 CPU 架構執行相同 Image？',['一定可以','需相容的架構及映像','只看 UI','與 CPU 無關'],1,'CPU 指令集與映像架構必須相容。'],['Hypervisor 的用途？',['管理虛擬機使用的硬體資源','產生 API 文件','做會議摘要','儲存密碼'],0,'Hypervisor 是虛擬化管理層。'],['NAS 部署 GPU 模型，最重要的前提？',['字體顏色','支援的硬體、Driver 與 Runtime','免費帳號數','API 名稱'],1,'運算加速受硬體、驅動和執行環境限制。'],['以下何者不等於容量驗收？',['只確認 Container 能啟動','負載測試','記憶體峰值量測','IOPS 量測'],0,'服務啟動不能證明正式負載下的可用性。']]},
{title:'Hybrid Cloud & Edge Computing',tag:'資料與運算放在哪裡',goal:'設計 Cloud–NAS 互通方案，能評估 Data Residency、離線運作、Latency 與成本。',topics:['Edge vs Cloud Processing','Data Residency','Offline-first','Hybrid Connectivity'],deliver:'NAS + Cloud API 的混合部署方案',sections:[
['Cloud 與 Edge 的不同角色',`<p><b>Edge Computing</b> 是把處理能力放在資料來源或使用者附近，例如 NAS、攝影機、門禁控制器。雲端可提供集中管理與彈性算力，Edge 則可改善部分低延遲、頻寬、離線與資料主權需求。</p><p>不是所有工作都應搬至 Edge：模型大小、更新頻率、設備功耗、運維能力可能限制端側推論。</p>`],
['資料流的三種選擇',`<div class="tablewrap"><table><tr><th>方式</th><th>資料流</th><th>適用情境</th><th>風險</th></tr><tr><td>Edge-only</td><td>資料與處理皆在地端</td><td>機密內容、離線能力</td><td>硬體與模型容量限制</td></tr><tr><td>Cloud-only</td><td>資料傳到 Cloud 處理</td><td>大型 GPU 算力</td><td>傳輸、隱私、連線與計價</td></tr><tr><td>Hybrid</td><td>按政策選擇端側或雲端</td><td>混合合規與容量需求</td><td>同步、切換、身份與操作複雜</td></tr></table></div>`],
['Hybrid 網路與故障設計',`<p>Hybrid Architecture 至少需回答：</p><ol><li>NAS 與 Cloud 如何建立受信任的連線？</li><li>Cloud 斷線後 Edge 是否保留核心功能？</li><li>哪些資料可出境，哪些必須保留在特定區域？</li><li>模型版本與設定如何同步？</li><li>Cloud 服務回復後，如何安全恢復排隊工作、避免重複執行？</li></ol><div class="callout warning"><b>安全提醒：</b>不要假設資料送到第三方 API 就一定會或不會被保留／訓練；應核對實際服務契約與組織政策。</div>`],
['Synology AI Center：推論路由策略',`<p>假設 AI Center 提供本地小模型與雲端大型模型，PM 可以定義策略：敏感資料先使用本地；非敏感且高複雜度任務在獲授權時交由雲端。若雲端 503 / Timeout，依業務需求選擇 Queue、告知稍後重試、或切換本地能力。</p><p>不要把 fallback 當成無條件自動切換；模型能力、資料使用同意與計費方式可能不同。</p><div class="callout"><b>交付：</b>畫出 NAS → Policy Router → Local Model / Cloud API 的資料流，製作 Data Classification × Inference Destination × Failure Behavior 的決策表。</div>`]
],quiz:[['Edge Computing 的核心特性？',['將運算靠近資料來源','一定只能在雲端','不需設備','只用於網頁 UI'],0,'Edge 把處理能力部署在資料來源或使用者附近。'],['Hybrid 最重要的資料治理問題？',['文字大小','哪些資料允許離開地端','GPU 外觀','產品命名'],1,'需明確資料分類、駐留與流向。'],['Cloud API 503 是否應立即將機密資料傳到另一供應商？',['一定','先檢查資料政策、授權與替代方案','只要便宜就可以','完全不用告知'],1,'Fallback 也需要遵循資料與授權邊界。'],['Edge-only 的主要限制可能是？',['設備算力與更新成本','網頁背景色','Cloud Region 數量','不需供電'],0,'端側硬體容量與維護有限。'],['網路斷線下的產品能力應如何定義？',['所有功能都宣稱可用','定義哪些功能離線可用以及恢復同步','忽略故障','只能重新安裝'],1,'Offline-first 需明確功能降級與恢復機制。']]},
{title:'AI / Firmware Infrastructure',tag:'最終技術決策案例',goal:'理解 GPU / Model Serving、Device Fleet、Firmware OTA 的基礎設施需求，完成跨域部署決策。',topics:['GPU / Model Hosting','Model Registry','Fleet Management','Firmware OTA Infrastructure'],deliver:'AI Center / Firmware 部署決策報告',sections:[
['AI Infrastructure：算力與模型不是同一件事',`<p>推論服務至少涵蓋 <b>Model Artifact、Runtime、Accelerator（GPU / NPU / CPU）、Model Serving API、Scheduler / Queue、Storage、Monitoring</b>。模型能否執行，不只取決於參數量，還包括精度、KV Cache、Batch Size、Latency、記憶體與硬體能力。</p><p>PM 應定義 <b>Time to First Token、Tokens/sec、Queue Time、GPU Utilization、Out-of-Memory、Success Rate</b> 等適當指標，但不同應用的 KPI 權重不一定相同。</p>`],
['Model Registry 與部署變更',`<p><b>Model Registry</b> 管理模型版本、來源、授權、相容 Runtime、部署狀態與驗證證據。部署新模型的風險包含不相容、效能退步、輸出品質改變、GPU 記憶體不足及權限／資料流異動。</p><div class="callout"><b>PM Release Gate：</b>模型版本與檔案校驗、相容 GPU、性能基線、回滾映像、資安掃描、Quality Evaluation、監控警戒線。</div>`],
['Firmware OTA Infrastructure',`<p>Firmware OTA 通常涉及 <b>Build Artifact、Code Signing、Update Manifest、Device Eligibility、Staged Rollout、Install / Reboot、Health Report、Recovery Strategy</b>。PM 不必開發 Bootloader，但必須了解更新的不可逆情況。</p><div class="flow"><div class="step"><b>Signed Firmware</b><small>Artifact & Manifest</small></div><span class="arrow">→</span><div class="step"><b>Rollout Service</b><small>Eligibility / Ring</small></div><span class="arrow">→</span><div class="step"><b>Edge Devices</b><small>Download / Verify</small></div><span class="arrow">→</span><div class="step"><b>Install & Health</b><small>Recovery / Telemetry</small></div></div><p>例如門禁設備須注意更新時可用性、掉電中斷、現場操作安全，以及是否支援雙分區 A/B 更新。不同裝置未必能安全地一鍵回滾。</p>`],
['Cloud AI vs Firmware OTA：共通與差異',`<div class="tablewrap"><table><tr><th>面向</th><th>AI Model Deployment</th><th>Firmware OTA</th></tr><tr><td>Artifact</td><td>模型檔與 Runtime</td><td>具簽章的 Firmware Image</td></tr><tr><td>相容性</td><td>GPU、記憶體、API</td><td>晶片、Bootloader、硬體版本</td></tr><tr><td>推出方式</td><td>Canary / Traffic Split</td><td>Device Ring / Staged Rollout</td></tr><tr><td>回復</td><td>回舊模型／服務版本</td><td>視 Bootloader、分區與資料格式而定</td></tr><tr><td>核心監控</td><td>Latency、錯誤、品質與成本</td><td>更新成功率、Boot Failure、Device Health</td></tr></table></div>`],
['Capstone：用 PM 視角做 Go / No-Go',`<p><b>情境 A：</b>AI Center 新模型在 QA 通過，但生產 GPU 記憶體不足，峰值延遲高於目標。<br><b>情境 B：</b>Smart Access Control Firmware 已完成測試，但部分舊硬體不支援新 Driver，OTA 後可能無法啟動。</p><ol><li>列出每個方案的 Release Scope、Compatibility Matrix、指標及未知事項。</li><li>訂出分批推出、暫停條件、技術 Owner 和 Support 通知方式。</li><li>針對失敗提出 Rollback／Roll Forward／安全停用決策。</li><li>寫一頁 ADR：Context、Options、Decision、Trade-offs、Evidence。</li></ol><div class="callout"><b>最終交付：</b>一份 Architecture Diagram、Release Gate Checklist、Risk Matrix 和 Go/No-Go Decision Report。這四項可轉化為 Platform / Firmware PM 面試案例。</div>`]
],quiz:[['AI 模型能在 GPU 執行，還需驗證什麼？',['記憶體與延遲等實際工作負載','只看名稱','取消監控','只測 UI'],0,'GPU 相容不等於具備足夠容量與服務品質。'],['OTA 最不能忽略的措施？',['Firmware 簽章與設備相容性','按鈕字體','行銷標語','產品顏色'],0,'裝置更新需檢查來源完整性及硬體相容。'],['所有 Firmware 更新都能一鍵回滾嗎？',['是','否，取決於設備設計、分區和資料相容性','只要有 Cloud 就可以','只要有 CDN 就可以'],1,'硬體與 Bootloader 可能限制回滾能力。'],['Model Registry 主要用途？',['管理模型 Artifact 與版本資訊','取代所有 GPU','替代 IAM','產生 DNS'],0,'Registry 幫助追蹤模型版本、來源與部署相容性。'],['Go / No-Go 最重要的證據？',['明確驗收、相容矩陣、監控及復原方案','RD 感覺應該可行','只看日期','只看最新技術'],0,'發版應依可驗證的風險與品質證據決策。']]}
];
const KEY='cloud_infra_crash_v1';let state={done:{},notes:{},answers:{},current:0};try{let v=JSON.parse(localStorage.getItem(KEY)||'{}');state={...state,...v}}catch(e){}let currentView='home';
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('無法儲存，請匯出備份')}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function count(){return Object.values(state.done).filter(Boolean).length}function show(v){currentView=v;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hidden',x.id!==v));if(v==='home')renderHome();if(v==='flow')renderFlow();if(v==='lesson')renderLesson();if(v==='backup')renderBackup();renderSide();window.scrollTo(0,0)}function openLesson(i){state.current=i;save();show('lesson')}
function renderSide(){document.getElementById('sidenav').innerHTML=modules.map((m,i)=>`<button class="nav ${currentView==='lesson'&&state.current===i?'active':''}" onclick="openLesson(${i})">D${i+1} · ${esc(m.title)}<span>${state.done[i]?'✓ 已完成':esc(m.tag)}</span></button>`).join('')}
function renderHome(){document.getElementById('home').innerHTML=`<div class="eyebrow">Technical PM Supplement · Crash Course</div><h1>Cloud & Infrastructure 速成課程</h1><p class="muted">6 章 × 約 90 分鐘 · 共 9 小時。補強雲端平台、雲端網路、虛擬化、Hybrid Cloud、Edge / Firmware 基礎設施；不重複 TPM W13–W18 的 Docker、Kubernetes、CI/CD 與 Observability 深度操作。</p><div class="grid"><div class="stat"><strong>${count()}/6</strong><small>完成章節</small></div><div class="stat"><strong>${Math.round(count()/6*100)}%</strong><small>學習進度</small></div><div class="stat"><strong>${(6-count())*1.5} h</strong><small>預估剩餘時間</small></div></div><div class="card hero"><h2>核心技術生命週期</h2><p>從工程師提交程式碼到使用者穩定使用產品，PM 必須理解「交付關卡」與「故障決策點」。</p><button class="btn primary" onclick="show('flow')">查看完整流程圖 →</button></div><div class="card"><h2>六章教材</h2><div class="chaptergrid">${modules.map((m,i)=>`<button class="chapter" onclick="openLesson(${i})"><span class="pill">D${i+1}${state.done[i]?' · 已完成':''}</span><b>${esc(m.title)}</b><small>${esc(m.goal)}</small><br><small>交付：${esc(m.deliver)}</small></button>`).join('')}</div></div><div class="card"><h2>時間分配與驗收</h2><p>每章建議：觀念 35 分鐘、Synology 情境 20 分鐘、實作 25 分鐘、測驗與反思 10 分鐘。最後一章整合成一頁部署決策報告。</p><p class="muted">本速成班以技術決策能力為主，不要求正式雲端帳號、付費資源或撰寫程式。來源可延伸閱讀 AWS、Google Cloud、Microsoft Learn 官方架構文件。</p></div>`}
function renderFlow(){document.getElementById('flow').innerHTML=`<div class="eyebrow">End-to-End Delivery Lifecycle</div><h1>最重要的技術流程</h1><p class="muted">這是整套課程的共同心智模型。不是特定產品或團隊的實際 Pipeline；不同團隊可能有人工審核、額外測試或不同部署工具。</p><div class="card"><h2>從 Code 到 Production</h2><div class="flow"><div class="step"><b>1. Developer</b><small>撰寫程式碼</small></div><span class="arrow">→</span><div class="step"><b>2. Git / PR</b><small>Review / Merge</small></div><span class="arrow">→</span><div class="step"><b>3. CI</b><small>Build + Tests</small></div><span class="arrow">→</span><div class="step"><b>4. Artifact</b><small>Image / Package</small></div></div><div class="flow"><div class="step"><b>5. Registry</b><small>Versioned Artifact</small></div><span class="arrow">→</span><div class="step"><b>6. CD → Staging</b><small>部署與 UAT</small></div><span class="arrow">→</span><div class="step"><b>7. Release Gate</b><small>Go / No-Go</small></div><span class="arrow">→</span><div class="step"><b>8. Production</b><small>使用者服務</small></div></div><div class="flow"><div class="step"><b>9. Monitoring</b><small>Logs / Metrics / Alerts</small></div><span class="arrow">→</span><div class="step"><b>10. Incident Decision</b><small>是否有重大異常？</small></div></div><div class="branch">✓ 正常：持續提供服務並觀察 SLO／使用者影響</div><div class="branch">⚠ 異常：暫停 Rollout → 確認影響範圍 → 選擇 Rollback / Hotfix / Roll Forward → 驗證復原</div></div><div class="card"><h2>每個環節 PM 必須問的問題</h2><div class="tablewrap"><table><tr><th>階段</th><th>PM 應確認</th><th>證據</th></tr><tr><td>Git / CI</td><td>變更是否完成 Review？哪些測試涵蓋回歸風險？</td><td>PR、Build / Test Result</td></tr><tr><td>Artifact</td><td>部署的 Image / Firmware 是否可追溯？</td><td>版本、Hash、簽章</td></tr><tr><td>Staging</td><td>環境與 Prod 的差異？UAT 是否完成？</td><td>UAT、Compatibility Matrix</td></tr><tr><td>Release Gate</td><td>哪個指標達標才可上線？誰有決策權？</td><td>Go/No-Go Checklist</td></tr><tr><td>Production</td><td>分批推出還是全量？如何降級與回退？</td><td>Rollout Plan、Feature Flag</td></tr><tr><td>Monitoring</td><td>如何判斷使用者受影響？</td><td>Error Rate、Latency、Health</td></tr><tr><td>Incident</td><td>Rollback 是否受資料／硬體相容性限制？</td><td>Runbook、Migration Plan</td></tr></table></div><div class="callout"><b>重要提醒：</b>CI 通常只執行預先定義的測試，不能保證完整回歸；Continuous Delivery 可保留人工批准；Firmware OTA 的回滾也不一定可行。</div></div><div class="card"><h2>Cloud AI 與 Firmware 的不同之處</h2><p>Cloud AI 的 Artifact 可能是 Container Image + Model Version，部署可採 Traffic Split / Canary；Firmware 的 Artifact 是簽章韌體，部署依硬體型號與裝置批次決定，更新期間可能重啟設備。</p><p><b>你要帶走的觀念：</b>所有交付鏈都有「版本、驗證、部署、監控、恢復」，但風險的可逆性不同。</p></div>`}
function renderLesson(){const i=state.current,m=modules[i],ans=state.answers[i]||{};document.getElementById('lesson').innerHTML=`<div class="eyebrow">Lesson ${i+1} of 6 · ${esc(m.tag)}</div><h1>${esc(m.title)}</h1><p class="muted">學習目標：${esc(m.goal)}</p><div class="actions"><span class="pill">90 min</span>${m.topics.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}<button class="btn" onclick="openLesson(${Math.max(0,i-1)})" ${i===0?'disabled':''}>← 上章</button><button class="btn" onclick="openLesson(${Math.min(5,i+1)})" ${i===5?'disabled':''}>下章 →</button></div><div class="card"><h2>本章交付成果</h2><p>${esc(m.deliver)}</p><label><input type="checkbox" ${state.done[i]?'checked':''} onchange="state.done[${i}]=this.checked;save();renderSide()"> 已完成教材、實作及自我驗收</label></div><div class="card"><h2>完整教材</h2>${m.sections.map(([title,body],j)=>`<div class="lesson"><h3>${j+1}. ${esc(title)}</h3>${body}</div>`).join('')}</div><div class="card"><h2>實作筆記與 PM 決策</h2><p class="muted">請寫下問題定義、技術選項、限制、成本／風險與驗收證據。</p><textarea oninput="state.notes[${i}]=this.value;save()" placeholder="在此記錄你的分析…">${esc(state.notes[i]||'')}</textarea></div><div class="card"><h2>D${i+1} 小測驗 · 5 題</h2>${m.quiz.map((q,k)=>`<div class="question"><b>${k+1}. ${esc(q[0])}</b>${q[1].map((op,j)=>`<label class="option"><input type="radio" name="q${k}" value="${j}" ${ans[k]===j?'checked':''} onchange="setAnswer(${i},${k},${j})"> ${esc(op)}</label>`).join('')}<div id="fb${k}"></div></div>`).join('')}<div class="actions"><button class="btn primary" onclick="grade(${i})">提交測驗／查看解析</button><button class="btn" onclick="resetQuiz(${i})">清空答案</button></div><div id="result"></div></div>`}
function setAnswer(i,k,j){state.answers[i]=state.answers[i]||{};state.answers[i][k]=j;save()}function grade(i){let score=0;const a=state.answers[i]||{};modules[i].quiz.forEach((q,k)=>{let correct=a[k]===q[2];if(correct)score++;document.getElementById('fb'+k).innerHTML=`<div class="answer ${correct?'':'bad'}">${a[k]===undefined?'尚未作答。':correct?'回答正確。':'正確答案：'+esc(q[1][q[2]])+'。'} ${esc(q[3])}</div>`});document.getElementById('result').innerHTML=`<b>得分：${score} / 5</b> ${score===5?'· 已掌握核心概念！':'· 建議重新檢查錯誤題目。'}`}function resetQuiz(i){state.answers[i]={};save();renderLesson()}
function renderBackup(){document.getElementById('backup').innerHTML=`<div class="eyebrow">Learning Data</div><h1>學習紀錄備份</h1><div class="card"><p>目前已完成 ${count()} / 6 章。資料保存在本瀏覽器 localStorage，不會自動同步到其他裝置或 Technical PM Learning Hub。</p><div class="actions"><button class="btn primary" onclick="exportData()">匯出 JSON</button><label class="btn">匯入 JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importData(event)"></label></div><p class="muted">匯入會以備份中的本速成課程紀錄覆蓋目前的本速成課程紀錄，不影響既有 TPM Learning Hub。</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify({version:1,course:'cloud-infra-crash',exportedAt:new Date().toISOString(),state},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='cloud-infrastructure-learning-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importData(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(data.course!=='cloud-infra-crash'||!data.state)throw Error('不是本課程備份');state={done:data.state.done||{},notes:data.state.notes||{},answers:data.state.answers||{},current:Math.max(0,Math.min(5,Number(data.state.current)||0))};save();alert('匯入成功');show('home')}catch(err){alert('無法匯入：'+err.message)}};r.readAsText(file)}
show('home');
</script></body></html>
